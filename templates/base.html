<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Jenofiya — Python Full-Stack Developer{% endblock %}</title>
<meta name="description" content="Jeno — Python Full-Stack Developer. Flask, MongoDB, MySQL, Docker. Final-year CSE student building production-style web applications.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<!-- jQuery loaded early in head so it's ready before any page script runs -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<nav class="site-nav">
  <div class="container d-flex align-items-center justify-content-between">
    <a class="brand" href="/">
      <span class="brand-mark">&lt;/&gt;</span>Jenofiya
    </a>
    <button class="nav-toggle d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span></span><span></span><span></span>
    </button>
    <div class="collapse navbar-collapse flex-grow-0" id="nav">
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/projects">Projects</a></li>
        <li><a href="/contact" class="nav-cta">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<main>
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container d-flex flex-column flex-md-row align-items-center justify-content-between gap-3">
    <p class="mb-0">&copy; 2026 Jenofiya. Built with Flask &amp; MongoDB.</p>
    <div class="footer-links">
      <a href="https://github.com/jenofiya2005" target="_blank" rel="noopener">GitHub</a>
      <a href="https://linkedin.com/in/jenofiya-j" target="_blank" rel="noopener">LinkedIn</a>
      <a href="mailto:jeno@example.com">Email</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
