{% extends "base.html" %}
{% block title %}Contact | Jenofiya{% endblock %}
{% block content %}

<section class="page-header">
  <div class="container">
    <p class="eyebrow">Contact</p>
    <h1>Let's talk.</h1>
    <p class="body-lg header-sub">Open to internships, full-time roles, and collaboration.</p>
  </div>
</section>

<section class="section-paper">
  <div class="container">
    <div class="contact-wrap">
      <form id="contact-form">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" class="form-control" id="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea class="form-control" id="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn-solid w-100">Send Message</button>
        <p id="form-status" class="mt-3 text-center"></p>
      </form>
    </div>
  </div>
</section>

{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/contact.js') }}"></script>
{% endblock %}
